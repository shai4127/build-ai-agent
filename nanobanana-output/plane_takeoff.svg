<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1d6e"/>
      <stop offset="0.55" stop-color="#c2438a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="1" stop-color="#ffcc33" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b5cff"/>
      <stop offset="1" stop-color="#5a24c9"/>
    </linearGradient>
    <clipPath id="fuselage">
      <path d="M180 470 Q160 430 220 410 L1180 300 Q1330 285 1400 330 Q1430 352 1395 372 Q1330 410 1180 420 L240 500 Q190 505 180 470 Z" transform="rotate(-12 800 420)"/>
    </clipPath>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1250" cy="640" r="260" fill="url(#sun)"/>
  <circle cx="1250" cy="640" r="95" fill="#ffe27a"/>
  <!-- clouds -->
  <g fill="#ffd9f0" opacity="0.75">
    <ellipse cx="260" cy="180" rx="140" ry="38"/><ellipse cx="330" cy="160" rx="90" ry="40"/>
    <ellipse cx="1350" cy="150" rx="160" ry="36"/><ellipse cx="1270" cy="135" rx="80" ry="34"/>
    <ellipse cx="700" cy="110" rx="110" ry="26"/>
  </g>

  <!-- ground & runway -->
  <path d="M0 700 L1600 640 L1600 900 L0 900 Z" fill="#2d1b4e"/>
  <path d="M0 760 L1600 690 L1600 760 L0 860 Z" fill="#3c3c46"/>
  <g stroke="#fff" stroke-width="8" stroke-linecap="round">
    <line x1="80" y1="808" x2="200" y2="801"/><line x1="320" y1="794" x2="440" y2="787"/>
    <line x1="560" y1="780" x2="680" y2="773"/><line x1="800" y1="766" x2="920" y2="759"/>
    <line x1="1040" y1="752" x2="1160" y2="745"/><line x1="1280" y1="738" x2="1400" y2="731"/>
  </g>
  <!-- runway lights -->
  <g fill="#ffe27a">
    <circle cx="60" cy="760" r="6"/><circle cx="300" cy="747" r="6"/><circle cx="540" cy="734" r="6"/>
    <circle cx="780" cy="721" r="6"/><circle cx="1020" cy="708" r="6"/><circle cx="1260" cy="695" r="6"/>
  </g>

  <!-- dust / speed lines -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.6">
    <line x1="20" y1="620" x2="160" y2="600"/><line x1="40" y1="560" x2="210" y2="535"/>
    <line x1="0" y1="500" x2="120" y2="482"/>
  </g>
  <g fill="#e8d7ff" opacity="0.55">
    <ellipse cx="230" cy="720" rx="120" ry="30"/><ellipse cx="140" cy="740" rx="90" ry="24"/>
  </g>

  <!-- AIRPLANE (rotated for takeoff) -->
  <g transform="rotate(-12 800 420)" stroke="#111" stroke-width="7" stroke-linejoin="round">
    <!-- far wing -->
    <path d="M760 360 L980 250 L1040 255 L880 375 Z" fill="#7b3fe4"/>
    <!-- tail fin -->
    <path d="M250 420 L170 220 Q165 200 190 200 L250 205 L380 405 Z" fill="#ffcc00"/>
    <!-- tail fin star -->
    <path d="M230 270 l10 22 24 2 -18 16 6 24 -22 -13 -21 13 6 -24 -18 -16 24 -2 Z" fill="#ff3d7f" stroke-width="5"/>
    <!-- fuselage -->
    <path d="M180 470 Q160 430 220 410 L1180 300 Q1330 285 1400 330 Q1430 352 1395 372 Q1330 410 1180 420 L240 500 Q190 505 180 470 Z" fill="url(#body)"/>
  </g>

  <!-- livery art clipped to fuselage -->
  <g clip-path="url(#fuselage)">
    <g transform="rotate(-12 800 420)">
      <!-- belly stripe -->
      <path d="M150 470 L1450 340 L1450 420 L150 540 Z" fill="#20e3c2"/>
      <!-- starbursts -->
      <g fill="#ffcc00" stroke="#111" stroke-width="5">
        <path d="M430 330 l25 45 50 -15 -30 45 40 30 -50 5 0 50 -35 -38 -40 30 10 -50 -48 -15 48 -20 -10 -48 40 30 Z"/>
        <path d="M1010 270 l22 40 45 -12 -26 40 36 26 -45 5 0 45 -31 -34 -36 27 9 -45 -43 -13 43 -18 -9 -43 36 27 Z"/>
      </g>
    </g>
  </g>

  <!-- original chunky characters painted on the fuselage (drawn on top, following plane angle) -->
  <g transform="rotate(-12 800 420)" stroke="#111" stroke-width="6" stroke-linejoin="round">

    <!-- 1. Bolt the robot -->
    <g transform="translate(330 395)">
      <rect x="-38" y="-62" width="76" height="66" rx="14" fill="#9fb4c8"/>
      <line x1="0" y1="-62" x2="0" y2="-82"/><circle cx="0" cy="-88" r="8" fill="#ff3d7f"/>
      <rect x="-28" y="-46" width="56" height="26" rx="10" fill="#1d2b3a"/>
      <circle cx="-13" cy="-33" r="7" fill="#20e3c2" stroke-width="3"/>
      <circle cx="13" cy="-33" r="7" fill="#20e3c2" stroke-width="3"/>
      <path d="M-16 -12 Q0 -2 16 -12" fill="none" stroke-width="5"/>
      <rect x="-26" y="4" width="52" height="34" rx="8" fill="#ff8a1f"/>
    </g>

    <!-- 2. Spike-y cactus with shades -->
    <g transform="translate(560 370)">
      <rect x="-30" y="-80" width="60" height="110" rx="30" fill="#4fd15a"/>
      <path d="M-30 -20 Q-60 -20 -58 -55" fill="none" stroke-width="16"/>
      <path d="M-30 -20 Q-60 -20 -58 -55" fill="none" stroke="#4fd15a" stroke-width="6"/>
      <path d="M-34 -50 H34 L28 -34 H6 L0 -42 L-6 -34 H-28 Z" fill="#111"/>
      <path d="M-14 -16 Q0 -4 16 -18" fill="none" stroke-width="5"/>
      <g stroke-width="3"><line x1="-20" y1="0" x2="-28" y2="-4"/><line x1="18" y1="8" x2="27" y2="4"/><line x1="0" y1="-66" x2="0" y2="-76"/></g>
      <path d="M-12 -82 l6 -14 6 10 6 -10 6 14 Z" fill="#ff3d7f" stroke-width="4"/>
    </g>

    <!-- 3. Punk girl with a confetti cannon -->
    <g transform="translate(790 345)">
      <path d="M-34 -50 L-20 -100 L-8 -62 L4 -110 L14 -64 L30 -98 L34 -48 Z" fill="#ff3d7f"/>
      <circle cx="0" cy="-34" r="38" fill="#ffd1a8"/>
      <circle cx="-13" cy="-38" r="6" fill="#111"/><circle cx="15" cy="-38" r="6" fill="#111"/>
      <path d="M-14 -16 Q2 -2 18 -16 Z" fill="#fff" stroke-width="4"/>
      <circle cx="-26" cy="-22" r="6" fill="#ff8fb3" stroke="none"/><circle cx="26" cy="-22" r="6" fill="#ff8fb3" stroke="none"/>
      <rect x="28" y="-6" width="70" height="30" rx="10" fill="#ffcc00"/>
      <circle cx="102" cy="9" r="14" fill="#111"/>
      <g stroke-width="3"><circle cx="128" cy="-6" r="6" fill="#20e3c2"/><circle cx="140" cy="18" r="5" fill="#ff3d7f"/><rect x="122" y="28" width="9" height="9" fill="#fff"/></g>
    </g>

    <!-- 4. Grinning skeleton in a beanie -->
    <g transform="translate(1030 320)">
      <circle cx="0" cy="-30" r="40" fill="#f6f1e1"/>
      <path d="M-42 -40 Q0 -100 42 -40 Z" fill="#20e3c2"/>
      <circle cx="0" cy="-82" r="10" fill="#ffcc00"/>
      <ellipse cx="-15" cy="-26" rx="11" ry="13" fill="#111"/><ellipse cx="15" cy="-26" rx="11" ry="13" fill="#111"/>
      <circle cx="-12" cy="-29" r="3" fill="#ff3d7f" stroke="none"/><circle cx="18" cy="-29" r="3" fill="#ff3d7f" stroke="none"/>
      <path d="M-4 -6 L0 -14 L4 -6 Z" fill="#111" stroke-width="3"/>
      <rect x="-22" y="0" width="44" height="14" rx="4" fill="#fff" stroke-width="4"/>
      <g stroke-width="3"><line x1="-11" y1="0" x2="-11" y2="14"/><line x1="0" y1="0" x2="0" y2="14"/><line x1="11" y1="0" x2="11" y2="14"/></g>
    </g>

    <!-- windows row -->
    <g fill="#bff8ff" stroke-width="4">
      <circle cx="1160" cy="335" r="9"/><circle cx="1195" cy="332" r="9"/><circle cx="1230" cy="329" r="9"/>
    </g>
    <!-- cockpit -->
    <path d="M1310 318 Q1350 312 1378 330 L1340 340 Q1318 338 1310 318 Z" fill="#1d2b3a"/>

    <!-- near wing -->
    <path d="M720 450 L960 610 L1030 612 L900 440 Z" fill="#ffcc00"/>
    <path d="M800 470 L960 590" stroke="#ff3d7f" stroke-width="10" fill="none"/>
    <!-- engine -->
    <rect x="860" y="455" width="120" height="50" rx="24" fill="#20e3c2"/>
    <ellipse cx="980" cy="480" rx="12" ry="25" fill="#1d2b3a"/>
    <!-- landing gear just leaving the ground -->
    <line x1="1180" y1="415" x2="1185" y2="455"/><circle cx="1186" cy="462" r="13" fill="#222"/>
    <line x1="700" y1="475" x2="705" y2="515"/><circle cx="706" cy="524" r="15" fill="#222"/>
    <line x1="740" y1="470" x2="745" y2="510"/><circle cx="746" cy="520" r="15" fill="#222"/>
  </g>

  <!-- engine exhaust glow -->
  <g transform="rotate(-12 800 420)" opacity="0.7">
    <ellipse cx="830" cy="480" rx="40" ry="14" fill="#ffe27a"/>
    <ellipse cx="780" cy="480" rx="60" ry="10" fill="#ff8a1f" opacity="0.6"/>
  </g>
</svg>
